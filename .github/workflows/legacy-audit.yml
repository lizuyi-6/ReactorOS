name: Legacy audit validation

on:
  push:
    branches: [audit/legacy-review-20260905]
  pull_request:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source for review
        run: git archive --format=tar.gz --output=reactor-audit-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: reactor-audit-source
          path: reactor-audit-source.tar.gz
          retention-days: 7
  rust-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: Run locked Rust test suite
        run: cargo test --locked --all-targets
