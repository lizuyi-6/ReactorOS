name: Legacy audit validation
on:
  push:
    branches: [main, audit/legacy-review-20260905]
  pull_request:
permissions:
  contents: read
concurrency:
  group: legacy-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: Run locked Rust test suite
        run: |
          set -o pipefail
          cargo test --locked --all-targets 2>&1 | tee rust-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-audit-rust-tests
          path: rust-tests.log
          retention-days: 14
  frontend-and-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Test actual HTTP and Pinia behavior
        run: |
          set -o pipefail
          node scripts/test-legacy-audit.mjs 2>&1 | tee frontend-tests.log
      - name: Build production frontend
        run: |
          set -o pipefail
          npm run frontend:build 2>&1 | tee frontend-build.log
      - name: Validate OTA safety gates without touching real services
        run: |
          set -o pipefail
          for script in scripts/verify-ota-*.sh; do
            echo "RUN $script"
            timeout 30 bash "$script"
          done 2>&1 | tee ota-shell-tests.log
          for script in scripts/verify-ota-*.mjs; do
            echo "RUN $script"
            timeout 30 node "$script"
          done 2>&1 | tee ota-node-tests.log
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-audit-delivery
          path: |
            frontend-tests.log
            frontend-build.log
            ota-shell-tests.log
            ota-node-tests.log
            docs/LEGACY_AUDIT_2026-09-05.md
          retention-days: 14
