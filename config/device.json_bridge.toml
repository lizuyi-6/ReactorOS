mode = "json_bridge"

[serial]
port = "/dev/ttyUSB0"
baudrate = 115200
parity = "N"
stopbits = 1
bytesize = 8
timeout_ms = 1000

[modbus]
slave_id = 1

[esp32]
frame_prefix = "RX"
command_prefix = "TX"
checksum = true
max_line_bytes = 256

[json_bridge]
state_path = "/project/state.json"
control_path = "/project/control.json"
max_state_age_ms = 6000
request_id_prefix = "reactor-os"
speed_steps_per_cycle = 200.0
speed_deadband_cpm = 1.0
temperature_deadband_c = 1.0
relay_temperature_control = false

[json_bridge.adc]
sensor = "product_concentration_percent"
scale = 0.0244200244
offset = 0.0
min_valid = 0.0
max_valid = 100.0

[modbus.registers.temperature_c]
address = 0
scale = 0.1
offset = 0.0
min_valid = 0.0
max_valid = 500.0

[modbus.registers.stirrer_rpm]
address = 1
scale = 1.0
offset = 0.0
min_valid = 0.0
max_valid = 2000.0

[modbus.registers.pressure_mpa]
address = 2
scale = 0.01
offset = 0.0
min_valid = 0.0
max_valid = 10.0

[modbus.registers.shake_speed_cpm]
address = 3
scale = 1.0
offset = 0.0
min_valid = 0.0
max_valid = 60.0

[modbus.registers.tilt_angle_deg]
address = 4
scale = 0.01
offset = -45.0
min_valid = -45.0
max_valid = 45.0

[modbus.registers.flow_rate_l_min]
address = 5
scale = 0.01
offset = 0.0
min_valid = 0.0
max_valid = 20.0

[modbus.registers.product_concentration_percent]
address = 6
scale = 0.1
offset = 0.0
min_valid = 0.0
max_valid = 100.0

[modbus.registers.ph]
address = 7
scale = 0.01
offset = 0.0
min_valid = 0.0
max_valid = 14.0

[modbus.registers.target_temperature_c]
address = 10
scale = 0.1
offset = 0.0

[modbus.registers.target_stirrer_rpm]
address = 11
scale = 1.0
offset = 0.0

[modbus.registers.target_shake_speed_cpm]
address = 12
scale = 1.0
offset = 0.0

[modbus.registers.target_pressure_mpa]
address = 13
scale = 0.01
offset = 0.0

[modbus.registers.heat_time_s]
address = 14
scale = 1.0
offset = 0.0

[modbus.registers.hold_time_s]
address = 15
scale = 1.0
offset = 0.0

[modbus.registers.cool_time_s]
address = 16
scale = 1.0
offset = 0.0
