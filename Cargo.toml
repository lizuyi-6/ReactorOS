[package]
name = "reactor-edge-daemon"
version = "0.1.0"
edition = "2021"
default-run = "reactor-edge-daemon"

[dependencies]
anyhow = "1.0.95"
aes-gcm = "0.10.3"
axum = { version = "0.7.9", features = ["ws"] }
axum-server = { version = "0.7.0", features = ["tls-rustls"] }
base64 = "0.22.1"
chrono = { version = "0.4.39", features = ["serde"] }
clap = { version = "4.5.23", features = ["derive", "env"] }
rand = "0.8.5"
reqwest = { version = "0.12.12", default-features = false, features = ["json", "rustls-tls"] }
rumqttc = "0.25.1"
rusqlite = { version = "0.32.1", features = ["bundled", "chrono"] }
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
sha2 = "0.10.8"
serialport = "4.6.1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "chrono"] }
tokio = { version = "1.42.0", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-modbus = { version = "0.17.0", default-features = false, features = ["rtu"] }
tokio-rustls = "0.26.4"
tokio-serial = "5.4.5"
toml = "0.8.19"
tower-http = { version = "0.6.2", features = ["fs", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
async-trait = "0.1.83"
wait-timeout = "0.2.1"
zip = { version = "8.6.0", default-features = false }

[dev-dependencies]
tempfile = "3.14.0"
tower = { version = "0.5.2", features = ["util"] }

# Tuned for the LubanCat 2 / RK3568 (4x Cortex-A55, ARM64) field target: a
# long-running, low-load edge daemon where binary size and resident memory
# matter more than the last few percent of throughput. Full LTO + a single
# codegen unit let the optimizer inline across crates and drop dead code;
# abort-on-panic removes landing pads and unwind tables (safe here: no code
# relies on catch_unwind); strip drops symbols. These shrink the image the
# board must store in both A/B slots and lower steady-state RSS.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true
