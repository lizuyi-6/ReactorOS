<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>旧演示入口已停用 - ReactorOS</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0a0c;
      --panel: #15171a;
      --line: #28342d;
      --text: #e4e2e4;
      --muted: #aebcab;
      --green: #00ff66;
      --blue: #00d2ff;
      --amber: #ffb020;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        linear-gradient(90deg, rgba(134,149,129,.12) 1px, transparent 1px),
        linear-gradient(180deg, rgba(134,149,129,.10) 1px, transparent 1px),
        var(--bg);
      background-size: 40px 40px;
      color: var(--text);
      font-family: "Segoe UI", "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif;
      font-size: 15px;
    }
    main {
      width: min(760px, 100%);
      border: 1px solid var(--line);
      background: rgba(21, 23, 26, .92);
      padding: clamp(24px, 5vw, 48px);
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 30px;
      padding: 0 12px;
      border: 1px solid rgba(255, 176, 32, .45);
      color: var(--amber);
      font: 700 12px/1 Consolas, "SFMono-Regular", monospace;
      text-transform: uppercase;
    }
    h1 {
      margin: 22px 0 12px;
      color: var(--green);
      font-size: clamp(30px, 6vw, 52px);
      line-height: 1;
      letter-spacing: 0;
    }
    p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.7;
    }
    .notice {
      margin-top: 24px;
      padding: 16px;
      border-left: 3px solid var(--blue);
      background: #101316;
      color: var(--text);
      font-family: Consolas, "SFMono-Regular", monospace;
      overflow-wrap: anywhere;
    }
    a {
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      margin-top: 28px;
      padding: 0 18px;
      border: 1px solid var(--green);
      color: var(--green);
      text-decoration: none;
      font-weight: 700;
    }
    a:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <div class="status">NO LOCAL DEMO DATA</div>
    <h1>旧演示入口已停用</h1>
    <p>该入口不再提供浏览器内置传感器模拟、离线示例曲线或本地演示批次。</p>
    <p>当前上位机只展示后端数据管线、设备状态、审计链和安全控制接口返回的数据。</p>
    <div class="notice">后端数据管线 required: /api/live, /api/v1/reactor/reactor_001/samples, /api/devices/status</div>
    <a href="/">进入真实数据管线 HMI</a>
  </main>
</body>
</html>
