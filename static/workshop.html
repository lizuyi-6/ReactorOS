<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="4; url=/">
  <title>ReactorOS - 真实数据管线入口</title>
  <style>
    :root {
      --bg: #0e0e10;
      --surface: #171719;
      --line: #3d4a3a;
      --text: #e4e2e4;
      --muted: #bbcbb5;
      --primary: #57f464;
      --warning: #ffa93c;
      --font-ui: "IBM Plex Sans", "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif;
      --font-data: "JetBrains Mono", Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        linear-gradient(90deg, rgba(134,149,129,.13) 1px, transparent 1px),
        linear-gradient(180deg, rgba(134,149,129,.10) 1px, transparent 1px),
        var(--bg);
      background-size: 40px 40px;
      color: var(--text);
      font-family: var(--font-ui);
    }

    main {
      width: min(720px, 100%);
      border: 2px solid var(--line);
      background: var(--surface);
      padding: 28px;
    }

    .kicker {
      color: var(--primary);
      font-family: var(--font-data);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 12px 0 14px;
      font-size: clamp(28px, 6vw, 44px);
      line-height: 1.08;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }

    .status {
      margin: 22px 0;
      padding: 16px;
      border: 1px solid rgba(255,169,60,.55);
      color: var(--warning);
      font-family: var(--font-data);
      line-height: 1.55;
    }

    a {
      display: inline-flex;
      align-items: center;
      min-height: 46px;
      padding: 0 18px;
      border: 1px solid var(--primary);
      color: #081009;
      background: var(--primary);
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <div class="kicker">ReactorOS HMI</div>
    <h1>旧演示入口已停用</h1>
    <p>为了保证前端只展示后端数据管线返回的数据，早期 workshop 静态演示页已经停用，不再生成本地随机传感器值。</p>
    <p>请使用主控 HMI。没有 ESP32 或外部数据管线上行样本时，系统会显示明确错误码，而不是展示假数据。</p>
    <div class="status">DATA SOURCE: BACKEND PIPELINE ONLY<br>NO LOCAL DEMO DATA</div>
    <a href="/">进入真实数据管线 HMI</a>
  </main>
</body>
</html>
